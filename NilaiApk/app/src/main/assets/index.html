const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(const b of u)c=CRC[(c^b)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const w32=(a,v)=>a.push(v&255,v>>>8&255,v>>>16&255,v>>>24&255),w16=(a,v)=>a.push(v&255,v>>>8&255);
 for(const [name,txt] of files){const nb=enc.encode(name),d=enc.encode(txt),c=crc32(d);
  const h=[];w32(h,0x04034b50);w16(h,20);w16(h,0x0800);w16(h,0);w16(h,0);w16(h,0x21);w32(h,c);w32(h,d.length);w32(h,d.length);w16(h,nb.length);w16(h,0);
  parts.push(new Uint8Array(h),nb,d);
  const e=[];w32(e,0x02014b50);w16(e,20);w16(e,20);w16(e,0x0800);w16(e,0);w16(e,0);w16(e,0x21);w32(e,c);w32(e,d.length);w32(e,d.length);w16(e,nb.length);w16(e,0);w16(e,0);w16(e,0);w16(e,0);w32(e,0);w32(e,off);
  cen.push(new Uint8Array(e),nb);off+=h.length+nb.length+d.length}
 let cs=0;cen.forEach(x=>cs+=x.length);const z=[];w32(z,0x06054b50);w16(z,0);w16(z,0);w16(z,files.length);w16(z,files.length);w32(z,cs);w32(z,off);w16(z,0);
 const all=[...parts,...cen,new Uint8Array(z)];let n=0;all.forEach(x=>n+=x.length);const out=new Uint8Array(n);let o=0;all.forEach(x=>{out.set(x,o);o+=x.length});return out}
const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xe=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
function xlsx(R){const s=DB.set,top=[R.title.toUpperCase(),s.sek+' - Kelas '+s.kel],nc=R.hd.length;let rows='';
 top.forEach((t,i)=>rows+=`<row r="${i+1}"><c r="A${i+1}" s="3" t="inlineStr"><is><t>${xe(t)}</t></is></c></row>`);
 const row=(r,n,st)=>`<row r="${n}">`+r.map((v,i)=>{const ref=colL(i)+n;return typeof v==='number'?`<c r="${ref}" s="${st}"><v>${v}</v></c>`:`<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join('')+'</row>';
 rows+=row(R.hd,4,1);R.rows.forEach((r,i)=>rows+=row(r,5+i,2));
 const widths=R.hd.map((h,i)=>{let m=String(h).length;R.rows.forEach(r=>m=Math.max(m,String(r[i]).length));return Math.min(Math.max(m+2,4),42)});
 const cols='<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
 const last=5+R.rows.length+1;
 const sig=[[last+1,'Mengetahui, Kepala Sekolah','Guru Kelas'],[last+5,s.kep,s.guru],[last+6,'NIP. '+s.nipk,'NIP. '+s.nip]];
 const mid=Math.max(3,Math.ceil(nc/2));let sg='';

function saveBin(name,mime,u8){if(window.Android&&Android.saveBase64){let b='';for(let i=0;i<u8.length;i+=8192)b+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));Android.saveBase64(name,mime,btoa(b));return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:mime}));a.download=name;document.body.append(a);a.click();a.remove()}
